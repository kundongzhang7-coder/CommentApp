server:
  port: 8081
spring:
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/hmdp?useSSL=false&serverTimezone=UTC
    username: root
    password: "guodong12XZL@"
  # Spring Boot 3 起 Redis 配置前缀从 spring.redis 迁到 spring.data.redis
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
  # 秒杀异步下单的消息队列
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # 生产者确认：correlated 表示由 CorrelationData 逐条关联确认结果
    publisher-confirm-type: correlated
    # 路由失败时把消息退回给生产者（配合 mandatory=true 使用）
    publisher-returns: true
    connection-timeout: 3000ms
    listener:
      simple:
        # 全局默认手动 ACK；具体容器在 RabbitMqConfig 里各自配置
        acknowledge-mode: manual
        prefetch: 1
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    com.hmdp: debug

# 可观测性：只暴露健康检查与基本信息，避免把 env 等敏感端点开到公网
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# 安全加固参数（口令全部可通过环境变量覆盖，无需改代码）
hmdp:
  redis:
    # 教程里演示多节点用的 2、3 号 Redisson 客户端默认关闭，
    # 否则只跑单节点 Redis 的环境会因连不上 6380/6381 而启动失败
    extra-nodes-enabled: false
  security:
    # 可信反向代理地址，支持精确 IP 与 CIDR。为空表示"没有反向代理"，
    # 此时完全忽略 X-Forwarded-For，只用 remoteAddr，避免伪造头绕过限流
    trusted-proxies: ${TRUSTED_PROXIES:}
    # 登录接口：同一 IP 在 10 分钟内最多尝试 10 次
    login-ip-max: 10
    login-window-minutes: 10
    # 同一手机号失败次数达到该值只打告警日志，不锁定（避免被恶意刷数锁死正常用户）
    login-user-alarm-threshold: 20
    # 秒杀接口：同一用户对同一张券 10 秒内最多请求 10 次
    seckill-user-max: 10
    seckill-window-seconds: 10
  mq:
    # 消费端本地重试次数，超过后 nack 到死信队列
    retry-max: 3
    # 重试退避基数（毫秒），第 n 次等待 n*该值
    retry-backoff-millis: 500