<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>黑马点评</title>
  <!-- 引入样式 -->
  <link rel="stylesheet" href="./css/element.css">

  <link href="./css/shop-list.css" rel="stylesheet">
  <link href="./css/main.css" rel="stylesheet">

  <style type="text/css">

  </style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="header-back-btn" @click="goBack"><i class="el-icon-arrow-left"></i></div>
    <div class="header-title">{{typeName}}</div>
    <div class="header-search">
      <i class="el-icon-search"></i>
    </div>
  </div>
  <div class="sort-bar">
    <div class="sort-item">
      <el-dropdown trigger="click" @command="handleCommand">
      <span class="el-dropdown-link">
        {{typeName}}<i class="el-icon-arrow-down el-icon--right"></i>
      </span>
        <el-dropdown-menu slot="dropdown">
          <el-dropdown-item v-for="t in types" :key="t.id" :command="t">
            {{t.name}}
          </el-dropdown-item>
        </el-dropdown-menu>
      </el-dropdown>
    </div>
    <div class="sort-item" @click="sortAndQuery('')">
      距离 <i class="el-icon-arrow-down el-icon--right"></i>
    </div>
    <div class="sort-item" @click="sortAndQuery('comments')">
      人气 <i class="el-icon-arrow-down el-icon--right"></i>
    </div>
    <div class="sort-item" @click="sortAndQuery('score')">
      评分 <i class="el-icon-arrow-down el-icon--right"></i>
    </div>
  </div>
  <div class="shop-list" @scroll="onScroll">
    <div class="shop-box" v-for="s in shops" :key="s.id" @click="toDetail(s.id)">
      <div class="shop-img"><img :src="s.images" alt=""></div>
      <div class="shop-info">
        <div class="shop-title shop-item">{{s.name}}</div>
        <div class="shop-rate shop-item" >
          <el-rate
              disabled v-model="s.score/10"
              text-color="#F63"
              show-score
          ></el-rate>
          <span>{{s.comments}}条</span>
        </div>
        <div class="shop-area shop-item">
          <span>{{s.area}}</span>
          <span v-if="s.distance">{{s.distance < 1000 ? s.distance.toFixed(1) + 'm' : (s.distance/1000).toFixed(1) + 'km'}}</span>
        </div>
        <div class="shop-avg shop-item">￥{{s.avgPrice}}/人</div>
        <div class="shop-address shop-item">
          <i class="el-icon-map-location"></i>
          <span>{{s.address}}</span>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<!-- 引入组件库 -->
<script src="./js/element.js"></script>
<script src="./js/common.js"></script>
<script>

  const app = new Vue({
    el: "#app",
    data: {
      util,
      loading: false,   // 是否正在请求中，防止并发重复请求
      noMore: false,    // 是否已经没有更多数据
      seq: 0,           // 请求序号，用来丢弃过期响应
      types: [], // 类型列表
      shops: [], // 商店列表
      typeName: "",
      params:{
        typeId: 0,
        current: 1,
        sortBy: "",
        x: 120.149993, // 经度
        y: 30.334229 // 纬度
      }
    },
    created() {
      // 获取参数
      this.params.typeId = util.getUrlParam("type");
      this.typeName = util.getUrlParam("name");
      // 查询类型
      this.queryTypes();
      // 查询商店
      this.queryShops();
    },
    methods: {
      queryTypes() {
        axios.get("/shop-type/list")
          .then(({data}) => {
            this.types = data;
          })
          .catch(err => {
            console.log(err);
            this.$message.error(err)
          })
      },
      queryShops(isReset) {
        // 1.切分类/换排序时：页码回第1页，清空已加载列表
        if (isReset) {
          this.params.current = 1;
          this.shops = [];
          this.noMore = false;
          this.loading = false;
        }
        // 2.正在请求 或 已经没有更多，直接返回，避免重复发请求
        if (this.loading || this.noMore) {
          return
        }
        // 3.本次请求的自增序号，响应回来时序号不一致说明已被新请求取代，丢弃
        const seq = ++this.seq;
        this.loading = true;
        axios.get("/shop/of/type", {
            params: this.params
          })
          .then(({data}) => {
            if (seq !== this.seq) {
              return
            }
            this.loading = false;
            if (!data || data.length === 0) {
              this.noMore = true;
              return
            }
            data.forEach(s => s.images = s.images.split(',')[0]);
            this.shops = this.shops.concat(data);
            // 4.这一页还没把容器撑满的话，用户根本滚不动，自动再取下一页
            this.$nextTick(() => this.checkFill());
          })
          .catch(err => {
            this.loading = false;
            console.log(err);
            this.$message.error(err)
          })
      },
      checkFill() {
        const el = this.$el.querySelector(".shop-list");
        if (!el) {
          return
        }
        // 内容高度 <= 容器高度，没有滚动条，补一页
        if (el.scrollHeight <= el.offsetHeight + 1 && !this.noMore) {
          this.params.current++;
          this.queryShops();
        }
      },
      handleCommand(t) {
        location.href = "/shop-list.html?type="+t.id+"&name="+t.name;
      },
      sortAndQuery(sortBy) {
        this.params.sortBy = sortBy;
        // 换排序方式就是一次全新查询：页码归1、清空旧列表、重新拉第一页
        this.queryShops(true);
      },
      goBack() {
        history.back();
      },
      toDetail(id) {
        location.href = "/shop-detail.html?id="+id
      },
      onScroll(e) {
        // 正在加载 或 已经到底 时，忽略滚动事件
        if (this.loading || this.noMore) {
          return
        }
        let scrollTop = e.target.scrollTop;
        let offsetHeight = e.target.offsetHeight;
        let scrollHeight = e.target.scrollHeight;
        // 距底部 1px 以内算触底，取下一页
        if(scrollTop + offsetHeight + 1 >= scrollHeight){
          this.params.current++
          this.queryShops();
        }
      },
    }
  })
</script>
</body>
</html>
